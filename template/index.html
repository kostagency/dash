<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Аналитика проекта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf3; --panel:#f7f8fb; --card:#ffffff; --ink:#0d1526; --muted:#7a8599; --faint:#a8b1c2; --line:#e6eaf1;
  --brand:#2e6cf0; --brand2:#1f55d6; --dark:#0d1526; --soft:#f2f4f8;
  --ok:#11a75c; --ok-bg:#e3f6ec; --bad:#e0413f; --bad-bg:#fde9e8; --wait:#8a94a8; --wait-bg:#eef0f4;
  --shadow:0 1px 2px rgba(13,21,38,.04),0 10px 30px rgba(13,21,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070b15; --panel:#0e1424; --card:#151c30; --ink:#e9edf6; --muted:#8a95ad; --faint:#5d6882; --line:#232c45;
  --brand:#3d7bff; --brand2:#2a5fe0; --dark:#e9edf6; --soft:#1b2339;
  --ok:#3ccf87; --ok-bg:#11301f; --bad:#ff6b6b; --bad-bg:#3a1618; --wait:#8a95ad; --wait-bg:#1f2740; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#070b15; --panel:#0e1424; --card:#151c30; --ink:#e9edf6; --muted:#8a95ad; --faint:#5d6882; --line:#232c45;
  --brand:#3d7bff; --brand2:#2a5fe0; --dark:#e9edf6; --soft:#1b2339;
  --ok:#3ccf87; --ok-bg:#11301f; --bad:#ff6b6b; --bad-bg:#3a1618; --wait:#8a95ad; --wait-bg:#1f2740; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 14px/1.4 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1200px;margin:24px auto;padding:0 16px 40px}
.panel{background:var(--panel);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.num{font-variant-numeric:tabular-nums}
.cap{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* шапка */
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:14px 18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:50px;height:50px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:800;letter-spacing:.04em;line-height:1.05;flex:none;padding:6px}
.brand .cap{color:var(--brand)}
h1{margin:3px 0 0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border:0;border-radius:999px;padding:8px 13px;font:800 11px Manrope,sans-serif;white-space:nowrap}
.pill.dark{background:var(--dark);color:var(--card)}
.pill.blue{background:var(--brand);color:#fff;cursor:pointer}
.pill.blue:disabled{opacity:.6;cursor:default}
.pill.ghost{background:transparent;color:var(--muted);font-weight:700}
.periods{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
.periods button{border:0;background:transparent;color:var(--muted);font:800 11px Manrope,sans-serif;padding:7px 11px;border-radius:999px;cursor:pointer}
.periods button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* главное + воронка */
.top{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-bottom:18px}
.hero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;border-radius:22px;padding:22px}
.hero .cap{color:rgba(255,255,255,.7)}
.hero-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.ht{background:rgba(255,255,255,.12);border-radius:16px;padding:14px}
.ht .cap{font-size:9px}
.ht .v{font-size:23px;font-weight:800;margin-top:8px}
.ht .s{font-size:10px;color:rgba(255,255,255,.65);margin-top:3px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pl{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px}
.pl .row{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:rgba(255,255,255,.85)}
.bar{height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}

.funnel{background:var(--card);border-radius:22px;padding:22px}
.funnel .h{display:flex;justify-content:space-between;align-items:flex-start}
.funnel h2{margin:4px 0 8px;font-size:17px;font-weight:800}
.live{font-size:10px;font-weight:800;color:var(--brand)}
.fr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.fr:last-child{border-bottom:0}
.fr .l{font-size:13px;font-weight:800}
.fr .s{font-size:10px;color:var(--muted);margin-top:1px}
.fr .v{font-size:19px;font-weight:800;color:var(--brand)}
.fr.wait .v{color:var(--faint)}

/* плитки */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border-radius:18px;padding:16px 18px}
.kpi .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .v{font-size:25px;font-weight:800;margin-top:12px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.wait{background:var(--wait-bg);color:var(--wait)}

/* динамика */
.box{background:var(--card);border-radius:22px;padding:20px 22px;margin-bottom:18px}
.box .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hint{font-size:11px;color:var(--faint);font-weight:700}
.scroll{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:800;color:var(--muted);font-size:11px;min-width:150px;white-space:normal}
td.tot{font-weight:800;color:var(--ink)}
td.z{color:var(--faint)}
tr.sub td:first-child{padding-left:22px;font-weight:700}

.weeks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wk{background:var(--soft);border-radius:18px;padding:16px}
.wk .d{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.wk .g{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin-top:14px}
.wk .g .cap{font-size:8px}
.wk .g b{display:block;font-size:15px;margin-top:3px}

.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:12px;color:var(--muted);margin-top:12px;font-weight:600}
.foot{font-size:11px;color:var(--faint);text-align:center;margin-top:16px;font-weight:600}
.err{background:var(--bad-bg);color:var(--bad);padding:12px 14px;border-radius:14px;margin-bottom:14px;display:none}

@media (max-width:960px){.top{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.weeks{grid-template-columns:1fr}}
@media (max-width:560px){.panel{padding:12px;border-radius:20px}.page{margin:12px auto;padding:0 10px 30px}.hero-tiles{grid-template-columns:1fr 1fr}.ht .v{font-size:19px}.plan{grid-template-columns:1fr}.kpi .v{font-size:21px}.kpis{gap:10px}h1{font-size:18px}}
</style>
</head>
<body>
<div class="page"><div class="panel">

  <div class="head">
    <div class="brand">
      <div class="logo" id="logo">GL</div>
      <div><div class="cap" id="brand">Дашборд</div><h1 id="title">Загрузка…</h1></div>
    </div>
    <div class="pills">
      <span class="pill dark" id="conn">Подключения</span>
      <div class="periods" role="group" aria-label="Период">
        <button data-p="today">Сегодня</button><button data-p="7">7 дней</button><button data-p="month" aria-pressed="true">Месяц</button><button data-p="prev">Прошлый</button>
      </div>
      <button class="pill blue" id="refresh">Обновить</button>
      <span class="pill ghost num" id="range"></span>
    </div>
  </div>
  <div class="err" id="err"></div>

  <div class="top">
    <div class="hero">
      <div class="cap" id="hero-cap">Главное за месяц</div>
      <div class="hero-tiles" id="hero"></div>
      <div class="plan" id="plan"></div>
    </div>
    <div class="funnel">
      <div class="h"><div><div class="cap">Воронка</div><h2>Реклама → продажи</h2></div><span class="live">Live</span></div>
      <div id="funnel"></div>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="box">
    <div class="h"><div class="cap">Динамика по дням</div><span class="hint">сначала итог периода, дальше дни от свежих к старым</span></div>
    <div class="scroll"><table id="days"></table></div>
  </div>

  <div class="box">
    <div class="h"><div class="cap">По неделям</div><span class="hint">с начала проекта</span></div>
    <div class="weeks" id="weeks"></div>
    <div class="note" id="crm-note" hidden></div>
  </div>

  <div class="foot" id="foot"></div>
</div></div>

<script>
let D=null, period='month';
const $=id=>document.getElementById(id);
const CUR={KZT:'₸',USD:'$',RUB:'₽'};
const n0=n=>Math.round(n).toLocaleString('ru-RU');
const money=n=>n==null||!isFinite(n)?'—':n0(n)+' '+(CUR[D.currency]||D.currency);
const pct=(a,b)=>b?a/b*100:null;
const fp=v=>v==null?'—':v.toFixed(1).replace('.',',')+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const dl=s=>{const [y,m,d]=s.split('-');return +d+' '+MON[m-1]};
const dlf=s=>{const [y,m,d]=s.split('-');return +d+' '+MONF[m-1]+' '+y+' г.'};
const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const crmOn=()=>D.crm.type!=='none';
const ST=()=>D.crm.stages||[];

function range(p){
  const t=D.today,[y,m]=t.split('-').map(Number),mm=String(m).padStart(2,'0');
  if(p==='today') return [t,t,'Главное за сегодня'];
  if(p==='7') return [add(t,-6),t,'Главное за 7 дней'];
  if(p==='month') return [`${y}-${mm}-01`,t,'Главное за месяц'];
  const pm=m===1?12:m-1,py=m===1?y-1:y,pp=String(pm).padStart(2,'0'),last=new Date(Date.UTC(py,pm,0)).getUTCDate();
  return [`${py}-${pp}-01`,`${py}-${pp}-${last}`,'Главное за прошлый месяц'];
}
function days(a,b){
  const m={};
  for(let d=a;d<=b;d=add(d,1)) m[d]={date:d,spend:0,impr:0,clicks:0,leads:0,st:ST().map(()=>0),rev:0};
  for(const r of D.ads) if(m[r.date]){const x=m[r.date];x.spend+=r.spend;x.impr+=r.impressions;x.clicks+=r.clicks;x.leads+=r.leads}
  for(const [d,c] of Object.entries(D.crm_days||{})) if(m[d]){c.stages.forEach((v,i)=>m[d].st[i]+=v);m[d].rev+=c.revenue}
  return Object.values(m);
}
function total(rows){
  const s={spend:0,impr:0,clicks:0,leads:0,st:ST().map(()=>0),rev:0};
  rows.forEach(r=>{s.spend+=r.spend;s.impr+=r.impr;s.clicks+=r.clicks;s.leads+=r.leads;r.st.forEach((v,i)=>s.st[i]+=v);s.rev+=r.rev});
  return s;
}
const cpl=s=>s.leads?s.spend/s.leads:null;
const stv=(s,i)=>crmOn()?n0(s.st[i]):'—';
function tag(v,norm,higherBetter){
  if(v==null) return '<span class="tag wait">'+(crmOn()?'Мало данных':'Ждёт CRM')+'</span>';
  if(!norm) return '';
  const ok=higherBetter?v>=norm:v<=norm;
  return `<span class="tag ${ok?'ok':'bad'}">${ok?'Норма':'Риск'}</span>`;
}

function render(){
  const [a0,b,cap]=range(period);
  const first=D.start_date||[...D.ads.filter(r=>r.spend||r.leads).map(r=>r.date),...Object.keys(D.crm_days||{})].reduce((m,d)=>d<m?d:m,'9999');
  const a=first>a0&&first<=b?first:a0;          // дни до старта проекта не показываем
  const rows=days(a,b), s=total(rows), st=ST(), last=st.length-1, on=crmOn();
  $('hero-cap').textContent=cap;
  $('range').textContent=a0===b?dlf(a0):dlf(a0)+' — '+dlf(b);

  const paid=on?s.st[last]:null, romi=on&&s.spend?(s.rev-s.spend)/s.spend*100:null;
  $('hero').innerHTML=[
    ['Потрачено',money(s.spend),D.currency!=='USD'?'≈ $'+n0(s.spend/D.usd_rate):''],
    ['Лиды',n0(s.leads),'цена лида '+money(cpl(s))],
    ['Оплачено',on?n0(paid):'—',on?money(s.rev)+(romi==null?'':' · ROMI '+Math.round(romi)+'%'):'после подключения CRM'],
  ].map(([l,v,x])=>`<div class="ht"><div class="cap">${l}</div><div class="v num">${v}</div><div class="s">${x}</div></div>`).join('');
  const P=D.plan||{}, isMonth=period==='month';
  const pb=(l,v,p,fmt)=>`<div class="pl"><div class="row"><span>${l}</span><span class="num">${fmt(v)} / ${isMonth&&p?fmt(p):'—'}</span></div><div class="bar"><i style="width:${isMonth&&p?Math.min(100,v/p*100):0}%"></i></div></div>`;
  $('plan').innerHTML=pb('Бюджет',s.spend,P.budget_month,money)+pb('Лиды',s.leads,P.leads_month,n0);

  let fr=`<div class="fr"><div><div class="l">Лиды с рекламы</div><div class="s">CPL ${money(cpl(s))}</div></div><div class="v num">${n0(s.leads)}</div></div>`;
  let prev=s.leads;
  st.forEach((x,i)=>{
    const v=on?s.st[i]:null;
    fr+=`<div class="fr ${on?'':'wait'}"><div><div class="l">${esc(x.label)}</div><div class="s">${on?'конверсия '+fp(pct(v,prev)):'ждёт подключения CRM'}</div></div><div class="v num">${on?n0(v):'—'}</div></div>`;
    if(on) prev=v;
  });
  $('funnel').innerHTML=fr;

  const N=D.norms||{}, i1=st.findIndex(x=>/зум/i.test(x.label)), i2=i1+1, ic=st.length-2;
  const k=[
    ['Цена лида',money(cpl(s)),N.cpl?'норма до '+money(N.cpl):'',tag(s.leads?cpl(s):null,N.cpl,false)],
    ['Лид → зум',on?fp(pct(s.st[i1],s.leads)):'—',N.lead_to_zoom?'норма от '+N.lead_to_zoom+'%':'',tag(on&&s.leads?pct(s.st[i1],s.leads):null,N.lead_to_zoom,true)],
    ['Доходимость зума',on?fp(pct(s.st[i2],s.st[i1])):'—',N.zoom_show?'норма от '+N.zoom_show+'%':'',tag(on&&s.st[i1]?pct(s.st[i2],s.st[i1]):null,N.zoom_show,true)],
    ['Договор → оплата',on?fp(pct(s.st[last],s.st[ic])):'—',N.contract_to_paid?'норма от '+N.contract_to_paid+'%':'',tag(on&&s.st[ic]?pct(s.st[last],s.st[ic]):null,N.contract_to_paid,true)],
  ];
  $('kpis').innerHTML=k.map(([l,v,x,t])=>`<div class="kpi"><div class="t"><span class="cap">${l}</span>${t}</div><div class="v num">${v}</div><div class="s">${x}</div></div>`).join('');

  // таблица: метрики строками, дни колонками, как в РНП
  const cols=[s,...[...rows].reverse()], heads=['Итого',...[...rows].reverse().map(r=>dl(r.date))];
  const line=(name,f,cls='')=>`<tr class="${cls}"><td>${name}</td>${cols.map((c,j)=>{const v=f(c);return `<td class="num ${j?'':'tot'} ${v==='0'||v==='—'||v==='0 ₸'?'z':''}">${v}</td>`}).join('')}</tr>`;
  let t='<thead><tr><th>Метрика</th>'+heads.map(h=>`<th>${h}</th>`).join('')+'</tr></thead><tbody>';
  t+=line('Расход',c=>money(c.spend));
  t+=line('Лиды',c=>n0(c.leads));
  t+=line('Цена лида',c=>money(cpl(c)));
  st.forEach((x,i)=>{
    t+=line(esc(x.label),c=>stv(c,i));
    const base=i===0?c=>c.leads:c=>c.st[i-1];
    t+=line('конверсия',c=>on?fp(pct(c.st[i],base(c))):'—','sub');
  });
  t+=line('Сумма оплат',c=>on?money(c.rev):'—');
  t+=line('ROMI',c=>on&&c.spend?Math.round((c.rev-c.spend)/c.spend*100)+'%':'—');
  $('days').innerHTML=t+'</tbody>';

  const dow=(new Date(D.today+'T00:00:00Z').getUTCDay()+6)%7, mon=add(D.today,-dow);
  let w='';
  for(let i=0;i<3;i++){
    let wa=add(mon,-7*i); const wb=i===0?D.today:add(wa,6);
    if(D.start_date&&wb<D.start_date) break;
    if(D.start_date&&wa<D.start_date) wa=D.start_date;
    const x=total(days(wa,wb));
    w+=`<div class="wk"><div class="d">${dl(wa)} — ${dl(wb)}</div><div class="g">
      <div><span class="cap">Расход</span><b class="num">${money(x.spend)}</b></div>
      <div><span class="cap">Лиды</span><b class="num">${n0(x.leads)}</b></div>
      <div><span class="cap">CPL</span><b class="num">${money(cpl(x))}</b></div>
      <div><span class="cap">Зумы проведены</span><b class="num">${on?n0(x.st[i2])+' · '+fp(pct(x.st[i2],x.leads)):'—'}</b></div>
    </div></div>`;
  }
  $('weeks').innerHTML=w;
  $('crm-note').hidden=on;
  $('crm-note').textContent='Зумы, договоры и оплаты подтянутся из amoCRM автоматически, как только подключим доступ. Сейчас на странице только реклама.';
}

async function load(){
  const btn=$('refresh'); btn.disabled=true; btn.textContent='Обновляю…';
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    D=await r.json();
    document.title=(D.brand||'Проект')+' · аналитика';
    $('brand').textContent=D.brand||''; $('title').textContent=D.title;
    $('logo').textContent=(D.brand||'').split('·')[0].trim();
    const u=new Date(D.updated_at);
    $('conn').textContent='Meta ✓ · '+(crmOn()?'amoCRM ✓':'amoCRM —');
    $('foot').textContent='Обновлено '+u.toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+
      ' · автообновление каждые 15 минут'+(D.currency!=='USD'?' · расход по курсу Нацбанка '+String(D.usd_rate).replace('.',',')+' ₸':'')+' · лид = начатая переписка в WhatsApp';
    $('err').style.display='none';
    const pb=document.querySelector('.periods [data-p="prev"]');
    pb.hidden=!!D.start_date&&D.start_date>=D.today.slice(0,8)+'01';
    render();
  }catch(e){$('err').style.display='block';$('err').textContent='Не получилось загрузить данные: '+e.message}
  btn.disabled=false; btn.textContent='Обновить';
}
document.querySelectorAll('.periods button').forEach(b=>b.onclick=()=>{period=b.dataset.p;document.querySelectorAll('.periods button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('refresh').onclick=load;
load(); setInterval(load,5*60*1000);
</script>
</body>
</html>
